apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.demo.cubestack.io
spec:
  # This driver has no ControllerPublishVolume yet (Task 6), so the attach step
  # must be skipped. Without this object Kubernetes assumes attachRequired=true
  # and the attach-detach controller waits for an external-attacher that does
  # not exist, failing the pod with:
  #   FailedAttachVolume: timed out waiting for external-attacher of ...
  attachRequired: false
  # The pod's identity is not needed in the volume context.
  podInfoOnMount: false
  # Only PV/PVC-backed volumes; no inline ephemeral volumes.
  volumeLifecycleModes:
    - Persistent
