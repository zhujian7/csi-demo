apiVersion: v1
kind: Pod
metadata:
  name: csi-demo-dynamic-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - 'echo written-on-a-dynamic-volume > /data/probe.txt && sleep 3600'
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: csi-demo-dynamic
